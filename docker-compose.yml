services:

  # ── Base de datos desarrollo ───────────────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: agro365_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-agro365}
      MYSQL_USER: ${DB_USERNAME:-agro365}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - agro365_network
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── Base de datos tests (MariaDB 10.11 LTS — sin ghost table bug) ──────────
  mariadb_test:
    image: mariadb:10.11
    container_name: agro365_mariadb_test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agro365_test
      MYSQL_USER: agro365
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mariadb_test_data:/var/lib/mysql
    networks:
      - agro365_network
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── phpMyAdmin ─────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: agro365_phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 300M
    ports:
      # 8081 chocaba con reform_viz (mismo valor por defecto). Llega
      # pre-autenticado como root: nunca exponerlo a la LAN.
      - "127.0.0.1:8085:80"
    networks:
      - agro365_network
    restart: unless-stopped
    depends_on:
      - mariadb

  # ── Mailhog (emails) ───────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: agro365_mailhog
    ports:
      # 1025/8025 chocaban con gsc_site y reform_viz (mismos valores por
      # defecto en los tres docker-compose).
      - "127.0.0.1:1030:1025"   # SMTP
      - "127.0.0.1:8030:8025"   # Web UI
    networks:
      - agro365_network
    restart: unless-stopped

networks:
  agro365_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  mariadb_test_data:
    driver: local
